name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the build number is the commit count
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build the app bundle
        run: ./scripts/build-app.sh
      - name: Check the bundle
        run: |
          test -x build/LiveWallpaper.app/Contents/MacOS/LiveWallpaper
          test -f build/LiveWallpaper.app/Contents/Resources/Shaders.metal
          test -f build/LiveWallpaper.app/Contents/Resources/ScenePrelude.metal
          test -f build/LiveWallpaper.app/Contents/Resources/LICENSE
          # Every scene in the repository reached the bundle, whole.
          for scene in Scenes/*/; do
            id="$(basename "$scene")"
            for file in scene.json LICENSE main.metal; do
              test -f "build/LiveWallpaper.app/Contents/Resources/Scenes/$id/$file" || { echo "missing $id/$file"; exit 1; }
            done
          done
          codesign --verify --deep --strict build/LiveWallpaper.app
          plutil -lint build/LiveWallpaper.app/Contents/Info.plist
      - name: Notices match the scene manifests
        run: python3 scripts/update-notices.py --check
      - name: Every scene compiles and draws
        # Fails on a scene that does not compile or draws nothing. The cost
        # limit is checked by scripts/check-scenes.sh, locally: hosted runners
        # have a virtual GPU, so their timings mean nothing.
        timeout-minutes: 10
        run: build/LiveWallpaper.app/Contents/MacOS/LiveWallpaper --check-scenes
