name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the build number is the commit count
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build the app bundle
        run: ./scripts/build-app.sh
      - name: Check the bundle
        run: |
          test -x build/LiveWallpaper.app/Contents/MacOS/LiveWallpaper
          test -f build/LiveWallpaper.app/Contents/Resources/Shaders.metal
          test -f build/LiveWallpaper.app/Contents/Resources/ScenePrelude.metal
          test -d build/LiveWallpaper.app/Contents/Resources/Scenes
          codesign --verify --deep --strict build/LiveWallpaper.app
          plutil -lint build/LiveWallpaper.app/Contents/Info.plist
      - name: Notices match the scene manifests
        run: python3 scripts/update-notices.py --check
      - name: Every scene compiles and draws
        # Hosted runners have a virtual GPU, so this is informational there;
        # scripts/check-scenes.sh is the real gate, run locally.
        continue-on-error: true
        run: build/LiveWallpaper.app/Contents/MacOS/LiveWallpaper --check-scenes
